<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cancionero – Caballeros de la Bohemia</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #0d0d0d;
    color: #f0e6d3;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(160deg, #0d0800 0%, #2a1400 45%, #1a0c00 100%);
    border-bottom: 2px solid #c8860a;
    padding: 32px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, #c8860a22 0%, transparent 70%);
    pointer-events: none;
  }
  header .header-inner {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  header .logo-wrap {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid #c8860a;
    box-shadow: 0 0 0 6px #c8860a22, 0 8px 32px #00000088;
    overflow: hidden;
    flex-shrink: 0;
  }
  header .logo-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  header .header-text { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  header .logo-line {
    font-size: 10px;
    letter-spacing: 5px;
    color: #c8860a;
    text-transform: uppercase;
  }
  header h1 {
    font-size: 24px;
    font-weight: 800;
    color: #f5d78e;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1.2;
  }
  header p { font-size: 13px; color: #a8896a; }
  @media(min-width: 520px) {
    header .header-inner { flex-direction: row; gap: 24px; text-align: left; justify-content: center; }
    header .header-text { align-items: flex-start; }
    header .logo-wrap { width: 130px; height: 130px; }
    header h1 { font-size: 28px; }
  }

  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-bottom: 20px;
    background: #1a1108; border: 1px solid #3b2a10; border-radius: 10px; padding: 16px;
  }
  .filters input, .filters select {
    flex: 1 1 180px;
    background: #0d0d0d; border: 1px solid #4a3318; border-radius: 6px;
    color: #f0e6d3; font-size: 14px; padding: 9px 12px; outline: none; transition: border-color .2s;
  }
  .filters input::placeholder { color: #6b5540; }
  .filters input:focus, .filters select:focus { border-color: #c8860a; }
  .filters select option { background: #1a1108; }
  .filters button {
    flex: 0 0 auto; background: #4a3318; border: 1px solid #c8860a; border-radius: 6px;
    color: #f5d78e; font-size: 13px; padding: 9px 16px; cursor: pointer; transition: background .2s;
  }
  .filters button:hover { background: #6b4a22; }

  .results-info { font-size: 12px; color: #7a6040; margin-bottom: 14px; letter-spacing: .5px; }

  .status-msg {
    text-align: center; padding: 40px 20px; font-size: 15px; color: #7a6040;
  }
  .status-msg .spinner {
    display: inline-block; width: 32px; height: 32px; margin-bottom: 12px;
    border: 3px solid #3b2a10; border-top-color: #c8860a;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg.error { color: #c85a3a; }

  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2e1f0a; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { background: #2a1800; border-bottom: 2px solid #c8860a; }
  thead th {
    padding: 12px 16px; text-align: left; color: #f5d78e;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #1e1208; transition: background .15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #1e1408; }
  tbody td { padding: 11px 16px; vertical-align: middle; }
  .td-cancion { font-weight: 600; color: #f5d78e; }
  .td-artista { color: #c8a060; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 9px;
    border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    white-space: nowrap;
  }
  .badge-Bolero    { background:#1a1030; color:#b899f5; border:1px solid #4a2a80; }
  .badge-Ranchera  { background:#1a0f0a; color:#f5a060; border:1px solid #8b3a10; }
  .badge-Balada    { background:#0a1a2a; color:#70b8f0; border:1px solid #1a5080; }
  .badge-Mariachi  { background:#1a1500; color:#f5d040; border:1px solid #7a6000; }
  .badge-Vals      { background:#0a1a10; color:#70f0a0; border:1px solid #1a6040; }
  .badge-Cumbia    { background:#1a0a1a; color:#f070e0; border:1px solid #801880; }
  .badge-default   { background:#1a1a1a; color:#aaa;    border:1px solid #444; }

  .btn-pedir {
    display: inline-flex; align-items: center; gap: 5px;
    background: #128c7e; border: none; border-radius: 6px; color: #fff;
    font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer;
    text-decoration: none; white-space: nowrap; transition: background .2s;
  }
  .btn-pedir:hover { background: #075e54; }

  .no-results {
    text-align: center; padding: 36px 0; color: #5a4030; font-size: 14px;
  }
  footer {
    text-align: center; font-size: 11px; color: #4a3820;
    border-top: 1px solid #2a1a08; padding: 16px; margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-wrap">
      <img id="logoImg" alt="Los Caballeros de la Bohemia"/>
    </div>
    <div class="header-text">
      <div class="logo-line">&#9830; Repertorio Oficial &#9830;</div>
      <h1>Los Caballeros<br>de la Bohemia</h1>
      <p>Encuentra tu canci&#243;n y env&#237;anos tu petici&#243;n por WhatsApp</p>
    </div>
  </div>
</header>

<div class="container">
  <div class="filters">
    <input type="text" id="searchNombre"  placeholder="Buscar por nombre de canci&#243;n..."/>
    <input type="text" id="searchArtista" placeholder="Buscar por artista..."/>
    <select id="filterGenero"><option value="">Todos los g&#233;neros</option></select>
    <button onclick="limpiar()">&#10005; Limpiar</button>
  </div>

  <div class="results-info" id="resultsInfo"></div>

  <div id="content">
    <div class="status-msg">
      <div class="spinner"></div><br/>Cargando cancionero...
    </div>
  </div>
</div>

<footer>Caballeros de la Bohemia &copy; 2025</footer>

<script>
var SHEET_ID  = "1-FouFMRXraKRkHfVMQcpJ2Jql5GgAKtR2kfrAI0Mg78";
var SHEET_TAB = "Cancionero";
var WA        = "523314105334";

var allSongs = [];

function norm(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function badgeClass(g) {
  var map = ["Bolero","Ranchera","Balada","Mariachi","Vals","Cumbia","Norteño","Trova"];
  return map.indexOf(g) >= 0 ? "badge-" + g : "badge-default";
}

var waIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">'
  + '<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15'
  + '-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475'
  + '-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52'
  + '.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207'
  + '-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372'
  + '-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487'
  + '.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413'
  + '.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004'
  + 'a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374'
  + 'a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898'
  + 'a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297'
  + 'A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945'
  + 'L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893'
  + 'a11.821 11.821 0 00-3.48-8.413Z"/></svg>';

function waLink(c) {
  var msg = "Hola! Me gustar\u00eda pedir la canci\u00f3n: \"" + c.cancion + "\" de " + c.artista + " (" + c.categoria + ").";
  return "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
}

function render() {
  var n = norm(document.getElementById("searchNombre").value);
  var a = norm(document.getElementById("searchArtista").value);
  var g = document.getElementById("filterGenero").value;

  var res = allSongs.filter(function(c) {
    if (n && norm(c.cancion).indexOf(n)  === -1) return false;
    if (a && norm(c.artista).indexOf(a)  === -1) return false;
    if (g && c.categoria !== g)                   return false;
    return true;
  });

  var info = res.length + " canci\u00f3n" + (res.length !== 1 ? "es" : "") + " encontrada" + (res.length !== 1 ? "s" : "");
  document.getElementById("resultsInfo").textContent = info;

  var content = document.getElementById("content");

  if (res.length === 0) {
    content.innerHTML = '<div class="no-results">No encontramos canciones con esos filtros.<br>Intenta con otros t\u00e9rminos.</div>';
    return;
  }

  var rows = res.map(function(c) {
    return '<tr>'
      + '<td class="td-cancion">' + esc(c.cancion) + '</td>'
      + '<td class="td-artista">' + esc(c.artista) + '</td>'
      + '<td><span class="badge ' + badgeClass(c.categoria) + '">' + esc(c.categoria) + '</span></td>'
      + '<td><a class="btn-pedir" href="' + waLink(c) + '" target="_blank" rel="noopener">'
      + waIcon + ' Pedir</a></td>'
      + '</tr>';
  }).join("");

  content.innerHTML = '<div class="table-wrap"><table>'
    + '<thead><tr>'
    + '<th>Canci\u00f3n</th><th>Artista</th><th>Categor\u00eda</th><th></th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table></div>';
}

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function limpiar() {
  document.getElementById("searchNombre").value  = "";
  document.getElementById("searchArtista").value = "";
  document.getElementById("filterGenero").value  = "";
  render();
}

function populateGenreFilter(songs) {
  var seen = {};
  var sel = document.getElementById("filterGenero");
  songs.forEach(function(c) {
    if (c.categoria && !seen[c.categoria]) {
      seen[c.categoria] = true;
      var opt = document.createElement("option");
      opt.value = c.categoria;
      opt.textContent = c.categoria;
      sel.appendChild(opt);
    }
  });
}

function showError(msg) {
  document.getElementById("content").innerHTML =
    '<div class="status-msg error">&#9888; ' + msg + '</div>';
}

function processSongs(resp) {
  if (!resp || !resp.table) {
    showError("No se pudo leer el cancionero. Verifica que el archivo est\u00e9 compartido p\u00fablicamente.");
    return;
  }

  var rows = resp.table.rows;

  var iCat = 0, iArt = 1, iCan = 2;
  if (rows.length > 0 && rows[0].c) {
    var h0 = norm((rows[0].c[0] && rows[0].c[0].v) ? rows[0].c[0].v : "");
    var h1 = norm((rows[0].c[1] && rows[0].c[1].v) ? rows[0].c[1].v : "");
    var h2 = norm((rows[0].c[2] && rows[0].c[2].v) ? rows[0].c[2].v : "");
    if (h0 === "categoria" || h0 === "categor\u00eda" || h1 === "artista" || h2 === "cancion" || h2 === "canci\u00f3n") {
      rows = rows.slice(1);
    }
  }

  var songs = [];
  rows.forEach(function(row) {
    if (!row.c) return;
    var cat = row.c[iCat] && row.c[iCat].v ? String(row.c[iCat].v).trim() : "";
    var art = row.c[iArt] && row.c[iArt].v ? String(row.c[iArt].v).trim() : "";
    var can = row.c[iCan] && row.c[iCan].v ? String(row.c[iCan].v).trim() : "";
    if (can) songs.push({ categoria: cat, artista: art, cancion: can });
  });

  if (songs.length === 0) {
    showError("La hoja est\u00e1 vac\u00eda. Agrega canciones en tu Google Sheet y recarga.");
    return;
  }

  allSongs = songs;
  populateGenreFilter(songs);
  render();
}

window.google = window.google || {};
window.google.visualization = window.google.visualization || {};
window.google.visualization.Query = window.google.visualization.Query || {};
window.google.visualization.Query.setResponse = function(resp) {
  clearTimeout(_sheetTimeout);
  var tag = document.getElementById("_sheetScript");
  if (tag) tag.parentNode.removeChild(tag);
  processSongs(resp);
};

var _sheetTimeout = setTimeout(function() {
  showError("Tiempo de espera agotado. Verifica tu conexi\u00f3n y que el archivo sea p\u00fablico.");
}, 10000);

(function loadSheet() {
  var url = "https://docs.google.com/spreadsheets/d/"
    + SHEET_ID
    + "/gviz/tq?tqx=out:json&sheet="
    + encodeURIComponent(SHEET_TAB);
  var tag = document.createElement("script");
  tag.id  = "_sheetScript";
  tag.src = url;
  tag.onerror = function() {
    clearTimeout(_sheetTimeout);
    showError("No se pudo cargar el script de Google Sheets. Verifica que el archivo sea p\u00fablico.");
  };
  document.head.appendChild(tag);
})();

document.getElementById("searchNombre").addEventListener("input", render);
document.getElementById("searchArtista").addEventListener("input", render);
